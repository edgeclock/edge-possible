<style>
/* Layout: story-mode overlay (one idea per screen) over a "snack scroll" deck of short, color-coded sticker sections.
   ADHD-friendly rules: <=15 words per chunk, an icon for every idea, progress always visible, nothing auto-advances. */
:root {
  --bg: #F3F5FB; --surface: #FFFFFF; --ink: #131C3A; --muted: #56607E; --line: #D6DBEA;
  --tarp: #FFC531; --tarp-ink: #2A1F00; --jeep: #D42A45; --sky: #2D5BD0; --ok: #1E9E6A;
  --night: #131C3A; --night-ink: #EDF0FA; --cta-bg: #131C3A;
  /* story slide colors: a single look in both themes */
  --s-tarp: #FFC531; --s-jeep: #D42A45; --s-sky: #2D5BD0; --s-ink: #131C3A; --s-light: #FFFFFF; --s-dark: #2A1F00;
  --display: "Bungee", "Arial Black", Impact, sans-serif;
  --body: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --mono: "DM Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0D1430; --surface: #16204A; --ink: #EDF0FA; --muted: #A3ACCB; --line: #2A3666; --jeep: #FF5C74; --sky: #7FA2FF; --ok: #4ED39A; --cta-bg: #060A1F; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #0D1430; --surface: #16204A; --ink: #EDF0FA; --muted: #A3ACCB; --line: #2A3666; --jeep: #FF5C74; --sky: #7FA2FF; --ok: #4ED39A; --cta-bg: #060A1F; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.5; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
a { color: inherit; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--tarp); outline-offset: 3px; }
.ico { width: 1em; height: 1em; display: inline-block; vertical-align: middle; flex: none; }
.ico svg { width: 100%; height: 100%; display: block; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ico.five { font-family: var(--display); line-height: 1; text-align: center; }

/* ---------- top bar: reading progress + jump chips ---------- */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); border-bottom: 1px solid var(--line); }
.topbar .prog { height: 4px; background: var(--line); }
.topbar .prog i { display: block; height: 100%; width: 0; background: var(--jeep); }
.topbar nav { display: flex; gap: 8px; align-items: center; overflow-x: auto; scrollbar-width: none; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.topbar nav::-webkit-scrollbar { display: none; }
.chip { flex: none; display: inline-flex; gap: 6px; align-items: center; font-size: 14px; font-weight: 600; text-decoration: none; padding: 6px 12px; border-radius: 99px; border: 1.5px solid var(--line); background: var(--surface); }
.chip.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip.play { background: var(--tarp); color: var(--tarp-ink); border-color: var(--tarp); }

/* ---------- sections ---------- */
.sec { padding-block: clamp(44px, 7vw, 84px); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); scroll-margin-top: 56px; }
.wrap { max-width: 1080px; margin: 0 auto; display: grid; gap: 22px; }
.sechead { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; align-items: center; }
.badge { grid-row: span 2; width: 58px; height: 58px; border-radius: 16px; display: grid; place-items: center; font-size: 30px; color: #fff; transform: rotate(-6deg); box-shadow: 0 8px 18px -10px rgba(0,0,0,.5); }
.sechead h2 { font-family: var(--display); font-weight: 400; font-size: clamp(26px, 4.4vw, 44px); line-height: 1.05; }
.sechead p { color: var(--muted); font-size: 16px; }
.c-jeep { background: var(--s-jeep); } .c-sky { background: var(--s-sky); } .c-tarp { background: var(--s-tarp); color: var(--s-dark) !important; } .c-ink { background: var(--s-ink); }
.alt { background: var(--surface); border-block: 1px solid var(--line); }
.more { font-size: 15px; color: var(--muted); }
.more summary { cursor: pointer; font-weight: 600; color: var(--ink); width: fit-content; }
.hint { font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: flex; gap: 8px; align-items: center; }

/* ---------- hero ---------- */
.hero { background: var(--tarp); color: var(--tarp-ink); border-bottom: 0; overflow: hidden; }
.hero .wrap { grid-template-columns: minmax(0, 1.25fr) minmax(0, .75fr); align-items: center; column-gap: clamp(24px, 5vw, 60px); }
.hero .copy { display: grid; gap: 18px; min-width: 0; }
.pills { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { font-family: var(--mono); font-size: 12.5px; letter-spacing: .06em; text-transform: uppercase; padding: 4px 10px; border-radius: 99px; border: 1.5px solid currentColor; display: inline-flex; gap: 6px; align-items: center; }
.hero h1 { font-family: var(--display); font-weight: 400; font-size: clamp(44px, 8vw, 104px); line-height: .92; }
.hero h1 em { font-style: normal; color: var(--s-jeep); }
.hero .sub { font-size: clamp(18px, 2.2vw, 22px); font-weight: 600; max-width: 34ch; }
.tldr { background: #fff; color: var(--s-ink); border-radius: 16px; padding: 16px 18px; display: grid; gap: 12px; box-shadow: 0 16px 30px -22px rgba(42,31,0,.6); max-width: 520px; }
.tldr b.t { font-family: var(--mono); font-size: 12px; letter-spacing: .12em; color: var(--s-jeep); }
.tldr div { display: grid; grid-template-columns: 34px 1fr; gap: 12px; align-items: center; font-weight: 600; line-height: 1.3; }
.tldr .ico { width: 34px; height: 34px; padding: 6px; border-radius: 10px; background: var(--s-tarp); color: var(--s-dark); }
.replay { justify-self: start; display: inline-flex; gap: 8px; align-items: center; background: var(--s-ink); color: #fff; border: 0; border-radius: 99px; padding: 10px 16px; font-weight: 700; }
.polaroid { position: relative; background: #fff; padding: 12px 12px 16px; border-radius: 4px; transform: rotate(3deg); box-shadow: 0 24px 40px -22px rgba(42,31,0,.55); justify-self: center; width: min(100%, 360px); margin: 0; }
.polaroid img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; }
.polaroid::before { content: ""; position: absolute; top: -14px; left: 50%; width: 110px; height: 28px; margin-left: -55px; background: rgba(212,42,69,.75); transform: rotate(-4deg); }
.stamp { position: absolute; left: -26px; bottom: 26px; transform: rotate(-12deg); border: 4px solid var(--s-jeep); color: var(--s-jeep); background: var(--s-tarp); font-family: var(--display); font-size: clamp(14px, 2vw, 22px); padding: 6px 12px; border-radius: 8px; }

/* ---------- goal meter: 20 chunky segments, one per ₱1,000 ---------- */
.meter { background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; display: grid; gap: 10px; }
.hero .meter { background: #fff; color: var(--s-ink); border: 0; max-width: 520px; }
.meter .top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.meter .amt { font-family: var(--display); font-size: 28px; line-height: 1; font-variant-numeric: tabular-nums; }
.meter .amt small { font-family: var(--mono); font-size: 13px; opacity: .7; }
.meter .who { font-family: var(--mono); font-size: 12.5px; opacity: .75; }
.segs { display: grid; grid-template-columns: repeat(20, 1fr); gap: 3px; }
.segs i { height: 18px; border-radius: 4px; background: rgba(127,135,160,.25); }
.segs i.on { background: var(--s-jeep); }
.segs i:nth-child(5n) { margin-right: 3px; }
.meter .line { font-size: 14.5px; font-weight: 600; }

/* ---------- flip cards ---------- */
.flips { display: grid; gap: 16px; }
.programs { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
.tiers { grid-template-columns: repeat(3, minmax(0, 1fr)); padding-top: 6px; }
@media (max-width: 900px) and (min-width: 641px) { .tiers { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.flip { --c: var(--s-ink); position: relative; display: grid; perspective: 1200px; background: none; border: 0; padding: 0; text-align: left; min-width: 0; }
.flip .face { grid-area: 1 / 1; border-radius: 18px; padding: 18px; display: grid; gap: 10px; align-content: start; backface-visibility: hidden; -webkit-backface-visibility: hidden; transition: transform .5s cubic-bezier(.3,1.3,.5,1); min-height: 230px; }
.flip .front { background: var(--surface); border: 2.5px solid var(--c); color: var(--ink); }
.flip .back { background: var(--c); color: #fff; transform: rotateY(180deg); }
.flip[aria-pressed="true"] .front { transform: rotateY(-180deg); }
.flip[aria-pressed="true"] .back { transform: rotateY(0); }
.flip .big { width: 54px; height: 54px; padding: 11px; border-radius: 14px; background: var(--c); color: #fff; }
.flip .name { font-family: var(--display); font-size: 22px; line-height: 1.05; }
.flip .sticker { position: absolute; top: -10px; right: 12px; z-index: 2; font-family: var(--mono); font-size: 11.5px; font-weight: 500; padding: 3px 9px; border-radius: 99px; background: var(--s-tarp); color: var(--s-dark); transform: rotate(4deg); }
.flip .tap { margin-top: auto; font-family: var(--mono); font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; opacity: .7; display: flex; gap: 6px; align-items: center; }
.flip ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.flip li { display: grid; grid-template-columns: 18px 1fr; gap: 8px; font-size: 15.5px; line-height: 1.3; }
.flip li .ico { width: 18px; height: 18px; margin-top: 1px; }
.flip .price { font-family: var(--display); font-size: 36px; line-height: 1; font-variant-numeric: tabular-nums; }
.flip .price small { font-family: var(--mono); font-size: 13px; opacity: .65; }
.flip .nick { font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; opacity: .7; }
.flip .hook { font-weight: 600; line-height: 1.3; }
.flip.feat .front { background: var(--s-tarp); color: var(--s-dark); }
.flip.glow .front { box-shadow: 0 0 0 5px var(--s-tarp), 0 0 0 9px var(--c); }
.flip .inherit { font-size: 13px; opacity: .8; border-top: 1px dashed rgba(255,255,255,.4); padding-top: 8px; }

.quests { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.quest { display: grid; grid-template-columns: 40px 1fr; gap: 2px 10px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; }
.quest .ico { grid-row: span 2; width: 40px; height: 40px; padding: 8px; border-radius: 12px; background: var(--s-sky); color: #fff; }
.quest b { font-family: var(--display); font-weight: 400; font-size: 18px; line-height: 1; }
.quest span { color: var(--muted); font-size: 13.5px; }

/* ---------- budget: rows drawn to scale of ₱20,000 ---------- */
.budget { display: grid; gap: 12px; }
.brow { display: grid; grid-template-columns: 46px minmax(0, 1fr) auto; gap: 4px 14px; align-items: center; }
.brow .ico { grid-row: span 2; width: 46px; height: 46px; padding: 10px; border-radius: 14px; background: var(--s-tarp); color: var(--s-dark); }
.brow .lab { font-weight: 800; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.brow .lab small { font-weight: 400; color: var(--muted); font-size: 14px; }
.brow .val { font-family: var(--mono); font-variant-numeric: tabular-nums; font-weight: 500; grid-row: span 2; }
.brow .bar { height: 12px; border-radius: 99px; background: var(--line); overflow: hidden; }
.brow .bar i { display: block; height: 100%; border-radius: 99px; background: var(--jeep); }
.total { display: flex; justify-content: space-between; align-items: center; font-family: var(--display); font-size: 24px; border-top: 3px dashed var(--line); padding-top: 12px; }
.note { display: flex; gap: 10px; align-items: center; background: var(--bg); border: 2px dashed var(--jeep); border-radius: 12px; padding: 12px 14px; font-weight: 600; font-size: 15.5px; }
.note .ico { width: 26px; height: 26px; color: var(--jeep); }

/* ---------- quiz ---------- */
.quiz { background: var(--surface); border: 2.5px solid var(--ink); border-radius: 22px; padding: clamp(18px, 3vw, 28px); display: grid; gap: 16px; max-width: 760px; box-shadow: 8px 8px 0 var(--tarp); }
.qsteps { display: flex; gap: 6px; }
.qsteps i { flex: 1; height: 6px; border-radius: 99px; background: var(--line); }
.qsteps i.on { background: var(--jeep); }
.quiz h3 { font-size: clamp(20px, 3vw, 26px); font-weight: 800; }
.opts { display: flex; flex-wrap: wrap; gap: 10px; }
.opts button { border: 2px solid var(--ink); background: var(--bg); border-radius: 14px; padding: 12px 16px; font-weight: 700; min-height: 48px; }
.opts button:hover { background: var(--tarp); color: var(--tarp-ink); border-color: var(--tarp); }
.result { display: grid; grid-template-columns: 76px 1fr; gap: 6px 16px; align-items: center; }
.result .ico { grid-row: span 3; width: 76px; height: 76px; padding: 16px; border-radius: 20px; color: #fff; transform: rotate(-6deg); }
.result .lbl { font-family: var(--mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.result b { font-family: var(--display); font-weight: 400; font-size: clamp(26px, 4vw, 36px); line-height: 1; }
.qact { display: flex; flex-wrap: wrap; gap: 10px; }
.btn { border: 2px solid var(--ink); background: transparent; border-radius: 12px; padding: 11px 16px; font-weight: 800; text-decoration: none; display: inline-flex; gap: 8px; align-items: center; min-height: 48px; }
.btn.solid { background: var(--ink); color: var(--bg); }

/* ---------- promises ---------- */
.stickers { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.stk { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: grid; gap: 6px; align-content: start; }
.stk:nth-child(odd) { transform: rotate(-1.5deg); } .stk:nth-child(even) { transform: rotate(1.5deg); }
.stk .ico { width: 44px; height: 44px; padding: 9px; border-radius: 12px; background: var(--s-jeep); color: #fff; margin-bottom: 4px; }
.stk b { font-size: 17px; }
.stk span { color: var(--muted); font-size: 15px; line-height: 1.35; }

/* ---------- trips ---------- */
.trips { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 4px 2px 10px; scrollbar-width: thin; }
.tk { flex: 0 0 200px; scroll-snap-align: start; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 6px; position: relative; }
.tk::after { content: ""; position: absolute; left: 0; right: 0; top: 54px; border-top: 2px dashed var(--line); }
.tk .w { font-family: var(--mono); font-size: 13px; color: var(--muted); height: 40px; }
.tk .w b { display: block; color: var(--ink); font-weight: 500; font-size: 15px; }
.tk .p { font-weight: 800; font-size: 19px; margin-top: 6px; display: flex; gap: 8px; align-items: center; }
.tk .p .ico { color: var(--sky); }
.tk .t { font-family: var(--mono); font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; padding: 3px 8px; border-radius: 99px; border: 1.5px solid currentColor; width: fit-content; }
.tk.ongoing .t { background: var(--jeep); border-color: var(--jeep); color: #fff; }
.tk.upcoming .t { color: var(--sky); } .tk.planned .t, .tk.tentative .t { color: var(--muted); } .tk.tentative .t { border-style: dashed; }

/* ---------- CTA ---------- */
.cta { background: var(--cta-bg); color: var(--night-ink); }
.cta .sechead p { color: rgba(237,240,250,.75); }
.gbtn { justify-self: start; font-family: var(--display); font-size: clamp(28px, 5vw, 44px); background: var(--s-tarp); color: var(--s-dark); border: 0; border-radius: 20px; padding: 16px 34px; box-shadow: 0 8px 0 #B88800; transform: rotate(-2deg); transition: transform .12s, box-shadow .12s; }
.gbtn:active { transform: rotate(-2deg) translateY(6px); box-shadow: 0 2px 0 #B88800; }
.joined { display: grid; gap: 16px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.15); border-radius: 18px; padding: 18px; max-width: 640px; }
.joined h3 { font-family: var(--display); font-weight: 400; font-size: 30px; color: var(--s-tarp); }
.joined ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; counter-reset: s; }
.joined li { counter-increment: s; display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: center; font-weight: 600; }
.joined li::before { content: counter(s); font-family: var(--display); width: 34px; height: 34px; border-radius: 10px; background: var(--s-tarp); color: var(--s-dark); display: grid; place-items: center; }
.pay { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; font-family: var(--mono); }
.pay .num { border: 2px dashed var(--s-tarp); padding: 10px 14px; border-radius: 10px; font-size: 20px; user-select: all; }
.pay button { background: var(--s-tarp); color: var(--s-dark); border: 0; border-radius: 10px; padding: 12px 16px; font-weight: 500; min-height: 48px; }
.cta .meter { background: rgba(255,255,255,.06); color: var(--night-ink); border-color: rgba(255,255,255,.15); max-width: 640px; }
.closer { font-size: 18px; max-width: 48ch; }
.links { display: flex; flex-wrap: wrap; gap: 10px 18px; font-family: var(--mono); font-size: 14px; }
.links a { color: var(--s-tarp); }
#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 60; }

/* ---------- STORY MODE ---------- */
.story { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: rgba(6,10,31,.85); }
.story[hidden] { display: none !important; }
.sframe { position: relative; width: min(100%, 460px); height: 100%; max-height: 860px; display: grid; grid-template-rows: auto 1fr auto; overflow: hidden; color: var(--s-light); background: var(--s-ink);
  padding: calc(12px + env(safe-area-inset-top, 0px)) max(18px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); transition: background .3s; }
@media (min-width: 600px) { .sframe { border-radius: 26px; height: calc(100% - 40px); } }
.sframe.tarp { background: var(--s-tarp); color: var(--s-dark); } .sframe.jeep { background: var(--s-jeep); } .sframe.sky { background: var(--s-sky); } .sframe.ink { background: var(--s-ink); }
.sbars { display: flex; gap: 4px; }
.sbars i { flex: 1; height: 4px; border-radius: 99px; background: currentColor; opacity: .25; }
.sbars i.done { opacity: 1; }
.shead { display: grid; gap: 10px; position: relative; z-index: 3; }
.srow { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.srow .who { display: flex; gap: 8px; align-items: center; font-weight: 800; font-size: 14px; }
.srow .who img { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; border: 2px solid currentColor; }
.skip { background: rgba(0,0,0,.18); border: 0; border-radius: 99px; padding: 8px 14px; font-weight: 700; font-size: 14px; color: inherit; display: inline-flex; gap: 6px; align-items: center; }
.sbody { display: grid; align-content: center; gap: 18px; position: relative; z-index: 1; pointer-events: none; }
.sbody .kick { font-family: var(--mono); font-size: 13px; letter-spacing: .12em; text-transform: uppercase; opacity: .85; }
.sbody h2 { font-family: var(--display); font-weight: 400; font-size: clamp(38px, 11vw, 54px); line-height: 1; }
.sbody .ssub { font-size: 20px; font-weight: 600; line-height: 1.3; opacity: .92; }
.sbody .bigico { width: 110px; height: 110px; padding: 22px; border-radius: 30px; background: rgba(255,255,255,.18); transform: rotate(-6deg); }
.sframe.tarp .bigico { background: rgba(42,31,0,.1); }
.sbody .bigico.five { font-size: 70px; padding: 14px; display: grid; place-items: center; }
.sbody .sphoto { width: 210px; aspect-ratio: 1; object-fit: cover; border: 10px solid #fff; border-bottom-width: 26px; transform: rotate(-4deg); box-shadow: 0 20px 30px -18px rgba(0,0,0,.6); }
.schips { display: flex; flex-wrap: wrap; gap: 8px; }
.schips span { font-family: var(--display); font-size: 17px; padding: 8px 12px; border-radius: 12px; background: rgba(255,255,255,.18); }
.sframe.tarp .schips span { background: rgba(42,31,0,.1); }
.sicons { display: flex; flex-wrap: wrap; gap: 10px; }
.sicons .ico { width: 56px; height: 56px; padding: 13px; border-radius: 16px; background: rgba(255,255,255,.18); }

@keyframes pop { from { transform: translateY(14px) scale(.97); } }

/* ---------- MOBILE ---------- */

}

/* v4: impact section + pay picker */

.opts { display: flex; flex-wrap: wrap; gap: 8px; }

.opts button small { display: block; font: 400 12px var(--mono); opacity: .8; }
.qr { display: grid; grid-template-columns: minmax(0, 220px) 1fr; gap: 14px; align-items: center; background: rgba(255,255,255,.06); border-radius: 14px; padding: 12px; }

.sendamt { font-family: var(--display); font-size: 26px; color: var(--s-tarp); }

.proofs { display: grid; gap: 12px; }

/* ===== v6: chapters, story fix, flip hints, compare table, quiz modal ===== */
.hero h1 { font-size: clamp(40px, 6.4vw, 84px); }
@media (min-width: 641px) { .hero .polaroid { align-self: start; margin-top: 56px; } }
.sechead .badge { grid-row: span 3; }
.chap { font-family: var(--mono); font-size: 12.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--jeep); font-weight: 500; }
.impact .chap, .twist .chap { color: inherit; opacity: .8; }
.cta .chap { color: var(--s-tarp); }

/* story-mode layout fix: never wider than the frame */
.sframe { grid-template-columns: minmax(0, 1fr); container-type: inline-size; }
.shead, .srow, .sbody, .sfoot { min-width: 0; }
.skip { white-space: nowrap; flex: none; }
.srow .who { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sbody h2 { font-size: clamp(28px, 9.6cqi, 48px); overflow-wrap: break-word; }
.sbody h2.long { font-size: clamp(26px, 8cqi, 40px); }
.sbody .ssub { font-size: clamp(16px, 4.6cqi, 20px); }
.sbody .bigico { width: 88px; height: 88px; padding: 18px; border-radius: 24px; }
.sbody .bigico.five { font-size: 56px; }

/* chapter 1: the dream */
.beats { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; counter-reset: b; }
.beats li { background: var(--surface); border: 2px solid var(--line); border-radius: 18px; padding: 16px; display: grid; gap: 6px; align-content: start; position: relative; }
.beats li:not(:last-child)::after { content: "→"; position: absolute; right: -14px; top: 50%; transform: translate(50%, -50%); font-family: var(--display); color: var(--jeep); font-size: 22px; }
.beats .when { font-family: var(--mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--sky); }
.beats b { font-size: 19px; line-height: 1.2; }
.beats span:last-child { color: var(--muted); font-size: 15.5px; line-height: 1.4; }
.mantra { display: flex; flex-wrap: wrap; gap: 10px; }
.mantra span { font-family: var(--display); font-size: clamp(18px, 3vw, 26px); padding: 8px 14px; border-radius: 12px; background: var(--s-tarp); color: var(--s-dark); }
.mantra span:first-child { background: var(--s-jeep); color: #fff; }

/* flip hints */
.fliphint { justify-self: start; display: inline-flex; gap: 10px; align-items: center; background: var(--s-tarp); color: var(--s-dark); font-weight: 800; padding: 10px 16px; border-radius: 99px; box-shadow: 0 6px 0 #B88800; }
.fliphint .ico { width: 22px; height: 22px; }
.flipme { margin-top: auto; justify-self: start; display: inline-flex; gap: 6px; align-items: center; font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; font-weight: 500; padding: 6px 10px; border-radius: 99px; background: var(--c); color: #fff; animation: pulse 1.8s ease-in-out infinite; }
.flipme .ico { width: 15px; height: 15px; }
.flip:hover .front { transform: rotateY(-12deg); }
.flip[aria-pressed="true"]:hover .front { transform: rotateY(-180deg); }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
@keyframes peekF { 0%, 100% { transform: rotateY(0); } 45% { transform: rotateY(-35deg); } }
@keyframes peekB { 0%, 100% { transform: rotateY(180deg); } 45% { transform: rotateY(145deg); } }
.peek .flip .front { animation: peekF 1.1s ease-in-out; }
.peek .flip .back { animation: peekB 1.1s ease-in-out; }
.peek .flip:nth-child(2) .face { animation-delay: .15s; } .peek .flip:nth-child(3) .face { animation-delay: .3s; } .peek .flip:nth-child(4) .face { animation-delay: .45s; } .peek .flip:nth-child(5) .face { animation-delay: .6s; }

/* chapter 3: plot twist */
.twist { background: var(--s-jeep); color: #fff; }
.twist .sechead p { color: rgba(255,255,255,.85); }
.twist .badge { background: var(--s-ink); }
.twistgrid { display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr); gap: 18px; align-items: stretch; }
.saving { background: rgba(0,0,0,.18); border-radius: 18px; padding: 18px; display: grid; gap: 10px; align-content: center; }
.saving .lbl { font-family: var(--mono); font-size: 13px; letter-spacing: .1em; text-transform: uppercase; }
.tank { height: 34px; border-radius: 10px; border: 3px solid #fff; padding: 3px; position: relative; }
.tank::after { content: ""; position: absolute; right: -10px; top: 8px; width: 6px; height: 12px; border-radius: 0 3px 3px 0; background: #fff; }
.tank i { display: block; height: 100%; border-radius: 5px; background: var(--s-tarp); animation: blink 1.2s steps(2) infinite; }
@keyframes blink { 50% { opacity: .35; } }
.saving .small { font-weight: 600; }
.fork { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.path { border-radius: 18px; padding: 16px; display: grid; gap: 6px; align-content: start; }
.path .ico { width: 40px; height: 40px; padding: 8px; border-radius: 12px; }
.path b { font-family: var(--display); font-weight: 400; font-size: 19px; line-height: 1.1; }
.path span { font-size: 15px; line-height: 1.35; }
.path.stop { background: rgba(0,0,0,.25); } .path.stop .ico { background: rgba(255,255,255,.2); }
.path.go { background: #fff; color: var(--s-ink); box-shadow: 0 6px 0 rgba(0,0,0,.25); } .path.go .ico { background: var(--s-tarp); color: var(--s-dark); }
.audit { font-size: clamp(18px, 2.4vw, 22px); font-weight: 700; max-width: 52ch; border-left: 6px solid var(--s-tarp); padding-left: 14px; }

/* chapter 6: compare table */
.cmp { overflow-x: auto; border-radius: 18px; border: 2px solid var(--line); background: var(--bg); -webkit-overflow-scrolling: touch; }
.cmp table { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 860px; font-size: 15px; }
.cmp th, .cmp td { padding: 10px 8px; border-bottom: 1px solid var(--line); text-align: center; vertical-align: middle; }
.cmp tbody th { text-align: left; font-weight: 600; position: sticky; left: 0; z-index: 1; background: var(--bg); min-width: 200px; max-width: 240px; }
.cmp tbody th { display: flex; gap: 10px; align-items: center; }
.cmp tbody th .ico { width: 20px; height: 20px; color: var(--jeep); }

.cmp .corner { position: sticky; left: 0; z-index: 2; background: var(--bg); text-align: left; font-family: var(--mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); vertical-align: bottom; }
.cmp .th { cursor: pointer; position: relative; padding-top: 22px; border-top: 6px solid var(--c); min-width: 104px; }
.cmp .th .ico { width: 30px; height: 30px; padding: 6px; border-radius: 9px; background: var(--c); color: #fff; display: block; margin: 0 auto 4px; }
.cmp .th .tn { display: block; font-family: var(--display); font-weight: 400; font-size: 15px; line-height: 1.1; }
.cmp .th .tp { display: block; font-family: var(--display); font-weight: 400; font-size: 19px; }
.cmp .th .tp small { font-family: var(--mono); font-size: 11px; opacity: .7; }
.cmp .th .tc { display: block; font-family: var(--mono); font-size: 12px; color: var(--muted); }
.cmp .th .sticker { position: absolute; top: 2px; left: 50%; transform: translateX(-50%); white-space: nowrap; font-family: var(--mono); font-size: 10.5px; padding: 1px 7px; border-radius: 99px; background: var(--s-tarp); color: var(--s-dark); }
.cmp .th.feat { background: rgba(255,197,49,.18); }
.cmp td.yes .ico { width: 22px; height: 22px; color: var(--ok); }
.cmp td.no { color: var(--muted); opacity: .6; }
.cmp td.new { background: rgba(255,197,49,.16); }
.cmp td.new .ico { color: var(--jeep); }
.cmp .sel { background: rgba(45,91,208,.14) !important; }
.cmp .th.sel { box-shadow: inset 0 0 0 3px var(--sky); }
.cmp tfoot td { border-bottom: 0; }
.cmp tfoot th { position: sticky; left: 0; background: var(--bg); }
.pick { border: 0; border-radius: 10px; padding: 9px 10px; min-height: 44px; font-weight: 800; font-size: 13.5px; background: var(--ink); color: var(--bg); width: 100%; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 14px; color: var(--muted); }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.legend i { width: 14px; height: 14px; border-radius: 4px; background: rgba(255,197,49,.5); display: inline-block; }

/* quiz entry + modal */
.quizsec { background: var(--s-sky); color: #fff; }
.quizsec .sechead p { color: rgba(255,255,255,.85); }
.quizsec .chap { color: var(--s-tarp); }
.quizsec .badge { background: var(--s-tarp); color: var(--s-dark); }
.quizbtn { justify-self: start; display: inline-flex; gap: 12px; align-items: center; font-family: var(--display); font-size: clamp(22px, 4vw, 34px); background: var(--s-tarp); color: var(--s-dark); border: 0; border-radius: 20px; padding: 16px 28px; box-shadow: 0 8px 0 #B88800; transform: rotate(-1.5deg); }

.qbody { pointer-events: auto; }
.qopts { display: grid; gap: 10px; }
.qopts button { border: 0; border-radius: 16px; padding: 14px 18px; min-height: 54px; font-weight: 800; font-size: 17px; text-align: left; background: rgba(255,255,255,.16); color: inherit; }
.sframe.tarp .qopts button { background: rgba(42,31,0,.1); }
.qopts button:hover { background: #fff; color: var(--s-ink); }
.qback { justify-self: start; background: none; border: 0; color: inherit; opacity: .8; font-weight: 700; padding: 8px 0; }
.recs { display: grid; gap: 12px; }
.rec { background: #fff; color: var(--s-ink); border-radius: 18px; padding: 14px 16px; display: grid; gap: 6px; border-left: 8px solid var(--c); }
.rec.top { box-shadow: 0 0 0 3px var(--s-tarp); }
.rec .rl { font-family: var(--mono); font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--s-jeep); }
.rec b { font-family: var(--display); font-weight: 400; font-size: 21px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.rec b .ico { width: 26px; height: 26px; padding: 5px; border-radius: 8px; background: var(--c); color: #fff; }
.rec b small { font-family: var(--mono); font-size: 12px; opacity: .7; }
.rec p { font-size: 15px; line-height: 1.35; }
.rec button { justify-self: start; border: 0; border-radius: 10px; padding: 10px 14px; min-height: 44px; font-weight: 800; background: var(--s-ink); color: #fff; }
.qfoot { display: flex; flex-wrap: wrap; gap: 10px; }
.qfoot button { border: 2px solid currentColor; background: none; color: inherit; border-radius: 12px; padding: 10px 14px; min-height: 44px; font-weight: 700; }
.sframe.ink .rec { color: var(--s-ink); }

/* chapter 8: the summary (aim for "that's right") */
.summary { background: rgba(255,255,255,.06); border: 1px dashed rgba(255,255,255,.3); border-radius: 18px; padding: 18px; display: grid; gap: 12px; max-width: 680px; }
.summary ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
.summary li { display: grid; grid-template-columns: 22px 1fr; gap: 10px; line-height: 1.4; }
.summary li .ico { width: 22px; height: 22px; color: var(--s-tarp); margin-top: 1px; }
.summary li em { font-style: normal; opacity: .75; }
.summary .ask { font-family: var(--display); font-size: clamp(20px, 3vw, 26px); color: var(--s-tarp); }

@media (max-width: 900px) { .beats { grid-template-columns: 1fr; } .beats li:not(:last-child)::after { content: "↓"; right: 50%; top: auto; bottom: -14px; transform: translate(50%, 50%); } .twistgrid { grid-template-columns: 1fr; } }
@media (max-width: 640px) { .fork { grid-template-columns: 1fr; } .cmp tbody th { min-width: 150px; font-size: 14px; } }
@media (prefers-reduced-motion: reduce) {
  .flipme, .tank i { animation: none; }
  .peek .flip .front, .peek .flip .back { animation: none; }
  .flip:hover .front { transform: none; }
}

/* ===== v7: scrollable quiz, coffee ask, nicknames ===== */
#quizm .sframe { grid-template-rows: auto minmax(0, 1fr) auto; }
#quizm .sbody { min-height: 0; overflow-y: auto; align-content: safe center; padding: 4px 2px 14px; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; scrollbar-width: thin; }

.coffee { display: grid; grid-template-columns: 64px 1fr; gap: 6px 14px; align-items: center; background: var(--s-ink); color: #fff; border-radius: 20px; padding: 16px 18px; max-width: 520px; box-shadow: 0 8px 0 rgba(42,31,0,.85); transform: rotate(-1deg); }
.coffee > .ico { grid-row: span 2; width: 64px; height: 64px; padding: 12px; border-radius: 18px; background: var(--s-tarp); color: var(--s-dark); animation: steam 2.4s ease-in-out infinite; }
.coffee b { font-family: var(--display); font-weight: 400; font-size: clamp(20px, 2.6vw, 26px); line-height: 1.1; }
.coffee b em { font-style: normal; color: var(--s-tarp); }
.coffee span { font-size: 15px; opacity: .85; }
.coffee .cq { grid-column: 1 / -1; font-weight: 800; font-size: 18px; color: var(--s-tarp); border-top: 1px dashed rgba(255,255,255,.3); padding-top: 10px; }
@keyframes steam { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg) translateY(-2px); } }
.coffee-line { display: flex; gap: 12px; align-items: center; font-weight: 800; font-size: clamp(17px, 2.2vw, 21px); }
.coffee-line .ico { width: 34px; height: 34px; padding: 6px; border-radius: 10px; background: var(--s-tarp); color: var(--s-dark); }
.cmp .th .tk { display: block; font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
@media (prefers-reduced-motion: reduce) { .coffee > .ico { animation: none; } }

/* ===== v8: hero diet, honest meter, untangled ask, bigger links ===== */
.hero .below { grid-column: 1 / -1; display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, .8fr); gap: 16px; align-items: start; }

.replay.big { font-size: 18px; padding: 14px 22px; box-shadow: 0 6px 0 rgba(0,0,0,.35); }

.after-btn { font-size: 16px; opacity: .85; font-weight: 600; }
.hero { padding-top: clamp(28px, 4vw, 44px); }
@media (min-width: 641px) { .hero h1 { font-size: clamp(40px, 5.6vw, 72px); } }
.links a { display: inline-flex; align-items: center; min-height: 44px; padding: 8px 16px; border-radius: 99px; border: 1.5px solid var(--s-tarp); text-decoration: none; font-weight: 500; }
@media (max-width: 640px) {
  .hero .coffee { order: 5; } .hero .replay { order: 6; } .hero .below { order: 8; grid-template-columns: 1fr; }
}

/* ===== v9: PC + mobile pass ===== */

    if (target === 'quiz') { var qs = $('quiz'); if (qs) qs.scrollIntoView(); openQuiz(); return; }
    if (target) { var el = $(target); if (el) el.scrollIntoView(); if (target === 'join') join(); }
  }
  function go(d) { var n = idx + d; if (n < 0 || n >= S.length) return; idx = n; renderStory(); var z = story.querySelector('.tapzone.next') || story.querySelector('.scta button'); if (z) z.focus({ preventScroll: true }); }
  var swiped = false;
  story.addEventListener('click', function (e) {
    if (swiped) { swiped = false; return; }
    if (e.target.closest('#skip')) return closeStory();
    var g = e.target.closest('[data-go]'); if (g) return closeStory(g.dataset.go);
    if (e.target.closest('.tapzone.next')) return go(1);
    if (e.target.closest('.tapzone.prev')) return go(-1);
  });
  document.addEventListener('keydown', function (e) {
    if (story.hidden) return;
    if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); go(1); }
    else if (e.key === 'ArrowLeft') go(-1);
    else if (e.key === 'Escape') closeStory();
  });
  var sx = null;
  story.addEventListener('pointerdown', function (e) { sx = e.clientX; });
  story.addEventListener('pointerup', function (e) { if (sx == null) return; var dx = e.clientX - sx; sx = null; if (Math.abs(dx) > 60) { swiped = true; setTimeout(function () { swiped = false; }, 400); go(dx < 0 ? 1 : -1); } });
  $('replay').addEventListener('click', openStory);
  $('chipStory').addEventListener('click', openStory);

  var seen = false; try { seen = localStorage.getItem('ep9-story-seen') === '1'; } catch (e) {}
  if (!seen && location.hash !== '#deck') openStory();
})();
</script>

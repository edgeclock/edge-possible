<style>
/* Layout: a stack of "tarpaulin" slides, Filipino signage energy; tiers hang like sari-sari price tags, budget prints like a resibo */
:root {
  --bg: #F3F5FB;
  --surface: #FFFFFF;
  --ink: #131C3A;
  --muted: #56607E;
  --line: #D6DBEA;
  --tarp: #FFC531;
  --tarp-ink: #2A1F00;
  --jeep: #D42A45;
  --sky: #2D5BD0;
  --cta-bg: #131C3A;
  --cta-fg: #EDF0FA;
  --display: "Bungee", "Arial Black", Impact, sans-serif;
  --body: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --mono: "DM Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1430; --surface: #16204A; --ink: #EDF0FA; --muted: #A3ACCB; --line: #2A3666;
    --tarp: #FFC531; --tarp-ink: #2A1F00; --jeep: #FF5C74; --sky: #7FA2FF; --cta-bg: #060A1F; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1430; --surface: #16204A; --ink: #EDF0FA; --muted: #A3ACCB; --line: #2A3666;
  --tarp: #FFC531; --tarp-ink: #2A1F00; --jeep: #FF5C74; --sky: #7FA2FF; --cta-bg: #060A1F; color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.55; }
a { color: var(--sky); }
a:focus-visible, button:focus-visible { outline: 3px solid var(--tarp); outline-offset: 3px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
p { margin: 0; }

.slide { padding-block: clamp(48px, 8vw, 96px); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); }
.wrap { max-width: 1080px; margin: 0 auto; display: grid; gap: 28px; }
.eyebrow { font-family: var(--mono); font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); display: flex; gap: 12px; align-items: center; }
.eyebrow b { background: var(--ink); color: var(--bg); padding: 2px 8px; border-radius: 3px; font-weight: 500; }
h2 { font-family: var(--display); font-weight: 400; font-size: clamp(28px, 4.6vw, 48px); line-height: 1.08; letter-spacing: .01em; }
.lede { font-size: clamp(18px, 2.2vw, 22px); max-width: 62ch; color: var(--muted); }

/* HERO */
.hero { background: var(--tarp); color: var(--tarp-ink); border-bottom: 0; position: relative; overflow: hidden; }
.hero .wrap { gap: 22px; }
.hero .eyebrow { color: var(--tarp-ink); opacity: .75; }
.hero h1 { font-family: var(--display); font-weight: 400; font-size: clamp(46px, 10vw, 128px); line-height: .92; letter-spacing: -.01em; max-width: 11ch; }
.hero h1 em { font-style: normal; color: var(--jeep); }
.hero .sub { font-size: clamp(18px, 2.4vw, 24px); max-width: 44ch; font-weight: 600; }
.hero .foot { font-family: var(--mono); font-size: 13px; opacity: .8; }
.stamp { position: absolute; right: max(16px, 6vw); top: 50%; transform: translateY(-50%) rotate(-12deg); border: 5px solid var(--jeep); color: var(--jeep); font-family: var(--display); font-size: clamp(18px, 2.6vw, 30px); padding: 10px 18px; border-radius: 10px; letter-spacing: .04em; opacity: .9; mix-blend-mode: multiply; animation: thunk .6s cubic-bezier(.2,1.6,.4,1) .3s both; }
@keyframes thunk { from { transform: translateY(-50%) rotate(-12deg) scale(1.6); opacity: .3; } }
.hero .wrap { grid-template-columns: minmax(0, 1.35fr) minmax(0, .85fr); align-items: center; column-gap: clamp(24px, 5vw, 64px); }
.hero .copy { display: grid; gap: 22px; min-width: 0; }
.hero h1 { font-size: clamp(44px, 8.4vw, 112px); }
.polaroid { position: relative; background: #fff; padding: 14px 14px 18px; border-radius: 4px; transform: rotate(3deg); box-shadow: 0 24px 40px -22px rgba(42,31,0,.55); justify-self: center; width: min(100%, 380px); display: grid; gap: 10px; }
.polaroid img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 2px; }
.polaroid figcaption { font-family: var(--mono); font-size: 13px; color: #2A1F00; text-align: center; line-height: 1.35; }
.polaroid::before { content: ""; position: absolute; top: -14px; left: 50%; width: 110px; height: 28px; margin-left: -55px; background: rgba(212,42,69,.75); transform: rotate(-4deg); }
.hero .stamp { right: auto; left: -28px; top: auto; bottom: 64px; transform: rotate(-14deg); background: var(--tarp); }
@keyframes thunk { from { transform: rotate(-14deg) scale(1.6); opacity: .3; } }
@media (max-width: 760px) {
  .hero .wrap { grid-template-columns: 1fr; }
  .polaroid { width: min(100%, 300px); }
  .hero .stamp { left: -12px; bottom: 40px; font-size: 16px; }
}

/* situation */
.situ { display: grid; gap: 14px; counter-reset: s; }
.situ p { font-size: clamp(18px, 2.3vw, 24px); padding-left: 44px; position: relative; max-width: 58ch; }
.situ p::before { counter-increment: s; content: counter(s); position: absolute; left: 0; top: 2px; width: 30px; height: 30px; border-radius: 50%; background: var(--ink); color: var(--bg); font-family: var(--mono); font-size: 14px; display: grid; place-items: center; }
.situ p:last-child { color: var(--jeep); font-weight: 600; }
.since { font-family: var(--mono); font-size: 14px; color: var(--muted); }

/* formula */
.formula { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.formula span.step { font-family: var(--display); font-size: clamp(18px, 2.8vw, 30px); background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 6px; }
.formula span.arrow { font-family: var(--display); color: var(--jeep); font-size: 26px; }
.note { font-family: var(--mono); font-size: 14px; color: var(--muted); }

/* programs */
.programs { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; }
.prog { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 22px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.prog .tag { font-family: var(--mono); font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--jeep); }
.prog h3 { font-size: 22px; font-weight: 800; }
.prog .proof { font-weight: 600; border-top: 1px dashed var(--line); padding-top: 10px; }
.prog .where { font-family: var(--mono); font-size: 12.5px; color: var(--muted); }
.prog ul { margin: 0; padding-left: 18px; font-size: 15px; color: var(--muted); }

/* side quests */
.quests { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px; }
.quest { border-left: 4px solid var(--tarp); padding: 4px 0 4px 16px; display: grid; gap: 2px; }
.quest .v { font-family: var(--display); font-size: 32px; line-height: 1.1; }
.quest .l { font-weight: 800; }
.quest .n { color: var(--muted); font-size: 15px; }

/* budget receipt */
.budget { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 32px; align-items: start; }
@media (max-width: 820px) { .budget { grid-template-columns: 1fr; } }
.receipt { background: var(--surface); border: 1px solid var(--line); padding: 26px 24px 30px; font-family: var(--mono); font-size: 14.5px; position: relative; box-shadow: 0 14px 30px -18px rgba(19,28,58,.35);
  -webkit-mask: radial-gradient(circle 7px at 50% 100%, transparent 98%, #000) 0 0 / 18px 100% repeat-x; mask: radial-gradient(circle 7px at 50% 100%, transparent 98%, #000) 0 0 / 18px 100% repeat-x; }
.receipt h4 { margin: 0 0 4px; text-align: center; font-size: 15px; letter-spacing: .16em; }
.receipt .sub { text-align: center; color: var(--muted); font-size: 12px; margin-bottom: 18px; }
.ritem { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: baseline; padding: 6px 0; }
.ritem .dots { border-bottom: 2px dotted var(--line); transform: translateY(-4px); }
.ritem .amt { font-variant-numeric: tabular-nums; }
.ritem small { grid-column: 1 / -1; color: var(--muted); font-size: 12px; margin-top: -4px; }
.rtotal { display: flex; justify-content: space-between; border-top: 2px dashed var(--ink); margin-top: 12px; padding-top: 12px; font-size: 18px; font-weight: 500; }
.bars { display: grid; gap: 12px; }
.stack { display: flex; height: 46px; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); }
.stack div { height: 100%; }
.legend { display: grid; gap: 8px; }
.legend div { display: grid; grid-template-columns: 14px 1fr auto; gap: 10px; align-items: center; font-size: 15px; }
.legend i { width: 14px; height: 14px; border-radius: 3px; }
.legend .j { color: var(--muted); font-size: 13.5px; grid-column: 2 / -1; margin-top: -6px; }
.legend .pct { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 13px; color: var(--muted); }
.callout { background: var(--bg); border: 2px dashed var(--jeep); border-radius: 10px; padding: 14px 16px; font-weight: 600; }

/* tiers as price tags */
.tiers { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 26px 20px; padding-top: 18px; }
.tag-card { --c: var(--ink); position: relative; background: var(--surface); border: 2px solid var(--c); border-radius: 10px 10px 14px 14px; padding: 34px 22px 22px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.tag-card::before { content: ""; position: absolute; top: 12px; left: 50%; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: var(--bg); border: 2px solid var(--c); }
.tag-card::after { content: ""; position: absolute; top: -20px; left: 50%; width: 2px; height: 34px; background: var(--muted); transform: rotate(18deg); transform-origin: bottom; opacity: .5; }
.tag-card .tname { font-family: var(--display); font-size: 24px; color: var(--c); }
.tag-card .nick { font-family: var(--mono); font-size: 12.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.tag-card .price { font-family: var(--display); font-size: 40px; line-height: 1; font-variant-numeric: tabular-nums; }
.tag-card .price small { font-family: var(--mono); font-size: 13px; color: var(--muted); }
.tag-card ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.tag-card li { padding-left: 22px; position: relative; font-size: 15.5px; }
.tag-card li::before { content: "✓"; position: absolute; left: 0; color: var(--c); font-weight: 800; }
.tag-card li.inh { color: var(--muted); }
.tag-card .flavor { font-style: italic; color: var(--muted); font-size: 14.5px; border-top: 1px dashed var(--line); padding-top: 10px; }
.tag-card .slots { position: absolute; top: 10px; right: 12px; font-family: var(--mono); font-size: 11px; background: var(--jeep); color: #fff; padding: 2px 7px; border-radius: 99px; }
.tag-card.featured { background: var(--tarp); color: var(--tarp-ink); }
.tag-card.featured .nick, .tag-card.featured .flavor, .tag-card.featured li.inh, .tag-card.featured .price small { color: var(--tarp-ink); opacity: .75; }
.tag-card.featured .badge { position: absolute; top: -14px; left: 16px; font-family: var(--mono); font-size: 11px; background: var(--jeep); color: #fff; padding: 3px 9px; border-radius: 4px; letter-spacing: .08em; text-transform: uppercase; }

/* paths */
.paths { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; }
.path { border: 1px solid var(--line); border-radius: 12px; padding: 20px; display: grid; gap: 12px; align-content: start; background: var(--surface); }
.path h3 { font-size: 20px; font-weight: 800; }
.eq { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-family: var(--mono); font-size: 13.5px; }
.chip { border: 1.5px solid var(--ink); border-radius: 99px; padding: 3px 10px; white-space: nowrap; }
.eq .op { color: var(--muted); }
.eq .sum { background: var(--ink); color: var(--bg); border-radius: 99px; padding: 3px 10px; font-variant-numeric: tabular-nums; }
.path p { color: var(--muted); }

/* promises + report */
.two { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 32px; align-items: start; }
@media (max-width: 820px) { .two { grid-template-columns: 1fr; } }
.promises { display: grid; gap: 18px; }
.promise h3 { font-size: 19px; font-weight: 800; display: flex; gap: 10px; align-items: baseline; }
.promise h3::before { content: "✦"; color: var(--jeep); }
.promise p { color: var(--muted); padding-left: 26px; max-width: 58ch; }
.report { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.report header { background: var(--ink); color: var(--bg); padding: 12px 18px; font-family: var(--mono); font-size: 13px; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.report dl { margin: 0; padding: 8px 18px 14px; }
.report dl div { display: flex; justify-content: space-between; gap: 16px; padding: 9px 0; border-bottom: 1px dashed var(--line); }
.report dt { color: var(--muted); }
.report dd { margin: 0; font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
.report .disc { padding: 0 18px 16px; font-family: var(--mono); font-size: 12px; color: var(--muted); }

/* trips as tickets */
.trips { display: grid; gap: 12px; }
.ticket { display: grid; grid-template-columns: minmax(130px, 210px) 1fr auto; gap: 18px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 18px; position: relative; }
.ticket .when { font-family: var(--mono); font-size: 13.5px; color: var(--muted); border-right: 2px dashed var(--line); padding-right: 14px; }
.ticket .where { font-weight: 800; font-size: 19px; }
.ticket .tn { color: var(--muted); font-size: 14.5px; }
.pill { font-family: var(--mono); font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; padding: 4px 10px; border-radius: 99px; border: 1.5px solid currentColor; white-space: nowrap; }
.pill.ongoing { background: var(--jeep); border-color: var(--jeep); color: #fff; }
.pill.upcoming { color: var(--sky); }
.pill.planned { color: var(--muted); }
.pill.tentative { color: var(--muted); border-style: dashed; }
@media (max-width: 640px) { .ticket { grid-template-columns: 1fr auto; } .ticket .when { grid-column: 1 / -1; border-right: 0; border-bottom: 2px dashed var(--line); padding: 0 0 8px; } }

/* CTA */
.cta { background: var(--cta-bg); color: var(--cta-fg); border-bottom: 0; }
.cta h2 { font-size: clamp(40px, 8vw, 96px); color: var(--tarp); }
.cta ol { margin: 0; padding: 0; list-style: none; counter-reset: c; display: grid; gap: 12px; max-width: 640px; }
.cta li { counter-increment: c; display: grid; grid-template-columns: 40px 1fr; gap: 12px; align-items: center; font-size: 19px; }
.cta li::before { content: counter(c); font-family: var(--display); background: var(--tarp); color: var(--tarp-ink); width: 40px; height: 40px; border-radius: 8px; display: grid; place-items: center; }
.pay { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; font-family: var(--mono); }
.pay .num { border: 2px dashed var(--tarp); padding: 10px 16px; border-radius: 8px; user-select: all; }
.pay button { font: inherit; background: var(--tarp); color: var(--tarp-ink); border: 0; border-radius: 8px; padding: 11px 16px; cursor: pointer; font-weight: 500; }
.closer { font-size: 20px; max-width: 52ch; }
.sign { font-family: var(--mono); font-size: 14px; opacity: .75; }
.links { display: flex; flex-wrap: wrap; gap: 10px 18px; font-family: var(--mono); font-size: 14px; }
.cta a { color: var(--tarp); }

/* MOBILE VERSION: swipe rows, compact hero, sticky action bar */
.swipe-hint, .mbar { display: none; }
@media (max-width: 640px) {
  body { font-size: 16px; padding-bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }
  .slide { padding-block: 44px; }
  .wrap { gap: 20px; }
  h2 { font-size: 26px; }
  .lede { font-size: 17px; }

  /* hero: headline, then a smaller tilted photo, then the pitch */
  .hero .wrap { gap: 18px; }
  .hero .copy { display: contents; }
  .hero .eyebrow { order: 1; }
  .hero h1 { order: 2; font-size: clamp(44px, 13vw, 60px); }
  .polaroid { order: 3; width: min(62vw, 240px); justify-self: end; margin: -6px 6px 6px 0; padding: 10px 10px 12px; }
  .polaroid figcaption { font-size: 11.5px; }
  .hero .sub { order: 4; font-size: 18px; }
  .hero .foot { order: 5; }
  .hero .stamp { left: -42px; right: auto; bottom: 34px; font-size: 13px; padding: 6px 10px; border-width: 3px; mix-blend-mode: normal; opacity: 1; animation: none; transform: rotate(-12deg); }

  /* swipe rows: one card at a time with the next one peeking */
  .programs, .tiers, .paths { display: flex; gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory; overscroll-behavior-x: contain;
    margin-inline: -16px; padding-inline: 16px; scroll-padding-inline: 16px; padding-bottom: 6px; scrollbar-width: none; }
  .programs::-webkit-scrollbar, .tiers::-webkit-scrollbar, .paths::-webkit-scrollbar { display: none; }
  .programs > *, .tiers > *, .paths > * { flex: 0 0 84%; scroll-snap-align: start; }
  .tiers { padding-top: 24px; }
  .swipe-hint { display: flex; justify-content: space-between; align-items: center; font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: -8px; }
  .swipe-hint b { color: var(--jeep); font-weight: 500; }

  .quests { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .quest { padding-left: 10px; }
  .quest .v { font-size: 20px; }
  .quest .n { display: none; }
  .ticket { padding: 12px 14px; gap: 10px; }
  .cta h2 { font-size: 44px; }
  .cta li { font-size: 17px; }

  /* sticky bottom bar */
  .mbar { display: flex; gap: 10px; position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
    background: var(--surface); border-top: 1px solid var(--line); box-shadow: 0 -10px 24px -16px rgba(0,0,0,.35); }
  .mbar a { flex: 1; text-align: center; text-decoration: none; font-weight: 800; padding: 12px 10px; border-radius: 10px; border: 2px solid var(--ink); color: var(--ink); }
  .mbar a.go { background: var(--tarp); border-color: var(--tarp); color: var(--tarp-ink); }
}

@media (prefers-reduced-motion: reduce) { .stamp { animation: none; } }
</style>

  });
})();
